<!-- 점성술(네이탈 차트) 인포그래픽 1080×1920 렌더링 템플릿 — 빅3 + 행성 배치 + 어스펙트 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171f; --bg2: #1c202b; --card: #202634; --line: #333b4d;
    --ink: #f0ead8; --sub: #a8a291; --gold: #d9a441;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #232a3a 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    display: flex; flex-direction: column;
    padding: 36px 56px 30px;
    gap: 16px;
  }
  .serif { font-family: 'Noto Serif KR', serif; }

  /* ── 헤더 ─────────────────────────── */
  header { text-align: center; }
  .kicker { letter-spacing: 8px; font-size: 22px; color: var(--gold); font-weight: 500; }
  .name { font-size: 54px; font-weight: 700; margin-top: 8px; }
  .birth { font-size: 24px; color: var(--sub); margin-top: 8px; }

  .section-title {
    font-size: 25px; font-weight: 700; color: var(--gold);
    letter-spacing: 4px; margin-bottom: 12px;
    display: flex; align-items: center; gap: 14px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  /* ── 빅3 히어로 ────────────────────── */
  .hero {
    background: linear-gradient(135deg, var(--card), var(--bg2));
    border: 1px solid var(--line); border-radius: 28px;
    padding: 24px 40px 22px;
  }
  .big3 { display: flex; justify-content: space-around; }
  .b3 { text-align: center; }
  .b3 .sym {
    width: 108px; height: 108px; border-radius: 50%; margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 52px; border: 3px solid var(--b3-color, var(--gold));
    color: var(--b3-color, var(--gold));
    background: rgba(255,255,255,.03);
  }
  .b3 .lbl { font-size: 21px; color: var(--gold); margin-top: 10px; font-weight: 700; }
  .b3 .sign { font-size: 24px; font-weight: 600; margin-top: 4px; }
  .b3 .house { font-size: 20px; color: var(--sub); margin-top: 2px; min-height: 24px; }
  .overview {
    font-size: 23px; color: var(--ink); line-height: 1.5; margin-top: 16px;
    text-align: center; word-break: keep-all;
  }

  /* ── 행성 배치 ─────────────────────── */
  .planets { display: flex; flex-direction: column; gap: 8px; }
  .pl-row {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 7px 20px;
  }
  .pl-name { width: 150px; font-size: 24px; font-weight: 600; flex: none; }
  .pl-sign { width: 210px; font-size: 23px; flex: none; }
  .pl-sign .z { font-size: 26px; margin-right: 6px; }
  .pl-deg { width: 110px; font-size: 21px; color: var(--sub); flex: none; }
  .pl-house { width: 120px; font-size: 21px; color: var(--sub); flex: none; }
  .pl-key { flex: 1; font-size: 21px; color: var(--sub); text-align: right; }
  .rx { color: #e88; font-size: 19px; margin-left: 4px; }

  /* ── 어스펙트 ─────────────────────── */
  .aspects { display: flex; flex-direction: column; gap: 8px; }
  .as-row {
    display: flex; align-items: center; gap: 16px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 7px 20px;
  }
  .as-pair { display: flex; align-items: center; gap: 12px; width: 460px; flex: none; font-size: 23px; font-weight: 600; }
  .as-sym { font-size: 30px; width: 44px; text-align: center; }
  .as-type { flex: 1; font-size: 22px; }
  .as-orb { font-size: 20px; color: var(--sub); }

  /* ── 영역별 카드 ───────────────────── */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    padding: 18px 22px; min-height: 170px;
  }
  .card .icon { font-size: 34px; }
  .card h3 { font-size: 25px; margin: 8px 0 8px; color: var(--gold); }
  .card p { font-size: 20px; line-height: 1.5; color: var(--ink); word-break: keep-all; }

  /* ── 푸터 ─────────────────────────── */
  footer { margin-top: auto; text-align: center; }
  .footer-line { font-size: 27px; font-weight: 700; color: var(--ink); letter-spacing: 1px; }
  .cta {
    display: inline-block; margin-top: 18px; font-size: 22px; letter-spacing: 2px;
    color: var(--gold); border: 1px solid var(--gold); border-radius: 999px; padding: 12px 38px;
  }
</style>
</head>
<body>
  <header>
    <div class="kicker">NATAL CHART</div>
    <div class="name serif" id="name"></div>
    <div class="birth" id="birth"></div>
  </header>

  <section class="hero">
    <div class="big3" id="big3"></div>
    <div class="overview" id="overview"></div>
  </section>

  <section>
    <div class="section-title">행성 배치</div>
    <div class="planets" id="planets"></div>
  </section>

  <section>
    <div class="section-title">어스펙트</div>
    <div class="aspects" id="aspects"></div>
  </section>

  <section>
    <div class="section-title">영역별 흐름</div>
    <div class="cards" id="cards"></div>
  </section>

  <footer>
    <div class="footer-line" id="footer-line"></div>
    <div class="cta">saju0523.pages.dev</div>
  </footer>

<script>
const DATA = __DATA_JSON__;

document.getElementById('name').textContent = DATA.meta.name;
document.getElementById('birth').textContent =
  `${DATA.meta.birth} · ${DATA.meta.place} · ${DATA.meta.gender}`;

// 빅3 (태양·달·상승)
document.getElementById('big3').innerHTML = DATA.big3.map(b => `
  <div class="b3" style="--b3-color:${b.color === '#C9CDD2' ? '#dfe3e8' : b.color}">
    <div class="sym">${b.symbol}︎</div>
    <div class="lbl">${b.label}</div>
    <div class="sign">${b.sign}</div>
    <div class="house">${b.house || ''}</div>
  </div>`).join('');
document.getElementById('overview').textContent = DATA.overview;

// 행성 배치 테이블
document.getElementById('planets').innerHTML = DATA.planets.map(p => `
  <div class="pl-row">
    <div class="pl-name">${p.name}${p.retrograde ? '<span class="rx">℞</span>' : ''}</div>
    <div class="pl-sign"><span class="z" style="color:${p.color === '#C9CDD2' ? '#dfe3e8' : p.color}">${p.symbol}︎</span>${p.sign}</div>
    <div class="pl-deg">${p.degree}</div>
    <div class="pl-house">${p.house}</div>
    <div class="pl-key">${p.keyword}</div>
  </div>`).join('');

// 어스펙트
document.getElementById('aspects').innerHTML = DATA.aspects.map(a => `
  <div class="as-row">
    <div class="as-pair">${a.p1}<span class="as-sym" style="color:${a.color}">${a.symbol}︎</span>${a.p2}</div>
    <div class="as-type" style="color:${a.color}">${a.type_kor}</div>
    <div class="as-orb">오브 ${a.orb}°</div>
  </div>`).join('');

// 영역별 카드
document.getElementById('cards').innerHTML = DATA.sections.map(s => `
  <div class="card">
    <div class="icon">${s.icon}</div>
    <h3>${s.heading}</h3>
    <p>${s.body}</p>
  </div>`).join('');

// 푸터
document.getElementById('footer-line').textContent = DATA.footer_line;
</script>
</body>
</html>
