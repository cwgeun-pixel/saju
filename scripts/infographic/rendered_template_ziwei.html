<!-- 자미두수 인포그래픽 1080×1920 렌더링 템플릿 — 12궁 명반 격자 + 사화 + 대한 타임라인 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171f; --bg2: #1c202b; --card: #202634; --line: #333b4d;
    --ink: #f0ead8; --sub: #a8a291; --gold: #d9a441;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #232a3a 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    display: flex; flex-direction: column;
    padding: 40px 56px 36px;
    gap: 20px;
  }
  .serif { font-family: 'Noto Serif KR', 'Noto Serif TC', serif; }
  .hanja { font-family: 'Noto Serif TC', 'Noto Serif KR', serif; }

  /* ── 헤더 ─────────────────────────── */
  header { text-align: center; }
  .kicker { letter-spacing: 10px; font-size: 22px; color: var(--gold); font-weight: 500; }
  .name { font-size: 54px; font-weight: 700; margin-top: 8px; }
  .birth { font-size: 24px; color: var(--sub); margin-top: 8px; }

  .section-title {
    font-size: 25px; font-weight: 700; color: var(--gold);
    letter-spacing: 4px; margin-bottom: 12px;
    display: flex; align-items: center; gap: 14px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  /* ── 12궁 명반 ─────────────────────── */
  .chart {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 172px);
    gap: 10px;
  }
  .palace {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 14px 12px; position: relative;
    display: flex; flex-direction: column;
  }
  .palace .pname { font-size: 21px; color: var(--gold); font-weight: 600; }
  .palace .stars { font-size: 25px; font-weight: 600; margin-top: 8px; line-height: 1.3; flex: 1; }
  .palace .gz { font-size: 19px; color: var(--sub); }
  .palace.ming { border: 2px solid var(--gold); background: rgba(217,164,65,.08); }
  .palace .badge {
    position: absolute; top: 12px; right: 12px;
    font-size: 17px; padding: 2px 10px; border-radius: 9px;
    background: var(--gold); color: #14171f; font-weight: 700;
  }
  .center {
    grid-row: 2 / span 2; grid-column: 2 / span 2;
    background: linear-gradient(135deg, var(--card), var(--bg2));
    border: 1px solid var(--line); border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px 28px; gap: 10px;
  }
  .center .c-stars { font-size: 52px; font-weight: 700; color: var(--gold); text-shadow: 0 0 30px rgba(217,164,65,.35); }
  .center .c-type { font-size: 24px; color: var(--sub); letter-spacing: 3px; }
  .center .c-desc { font-size: 21px; color: var(--ink); line-height: 1.5; word-break: keep-all; }

  /* ── 사화 ─────────────────────────── */
  .sihua { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sh {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px 16px 14px; text-align: center;
  }
  .sh .type {
    display: inline-block; font-size: 21px; font-weight: 700; color: #fff;
    border-radius: 999px; padding: 4px 18px;
  }
  .sh .star { font-size: 27px; font-weight: 600; margin-top: 10px; }
  .sh .where { font-size: 19px; color: var(--sub); margin-top: 4px; }
  .sh .desc { font-size: 18px; color: var(--sub); margin-top: 8px; line-height: 1.45; word-break: keep-all; }

  /* ── 대한 타임라인 ─────────────────── */
  .timeline { position: relative; padding: 40px 10px 0; }
  .timeline .axis { position: absolute; top: 60px; left: 40px; right: 40px; height: 3px; background: var(--line); }
  .tl-items { display: flex; justify-content: space-between; position: relative; }
  .tl-item { text-align: center; width: 170px; }
  .tl-dot {
    width: 18px; height: 18px; border-radius: 50%; background: var(--line);
    margin: 12px auto 12px; position: relative; z-index: 1;
  }
  .tl-item .age { font-size: 21px; color: var(--sub); }
  .tl-item .gz { font-size: 30px; font-weight: 600; margin-top: 4px; }
  .tl-item .pal { font-size: 20px; color: var(--sub); margin-top: 4px; }
  .tl-item.current .tl-dot { background: var(--gold); box-shadow: 0 0 0 8px rgba(217,164,65,.22); }
  .tl-item.current .gz, .tl-item.current .age, .tl-item.current .pal { color: var(--gold); font-weight: 700; }
  .tl-item.current::before {
    content: '현재'; display: inline-block; font-size: 19px; color: #14171f;
    background: var(--gold); border-radius: 10px; padding: 2px 12px; margin-bottom: 2px;
  }
  .tl-item:not(.current)::before { content: ''; display: block; height: 27px; }

  /* ── 결론 + CTA ───────────────────── */
  footer { margin-top: auto; text-align: center; }
  .conclusion {
    font-size: 30px; font-weight: 700; line-height: 1.45; word-break: keep-all;
    color: var(--ink);
  }
  .conclusion::before { content: ' ❝ '; color: var(--gold); }
  .conclusion::after { content: ' ❞ '; color: var(--gold); }
  .liuyear { font-size: 23px; color: var(--sub); margin-top: 12px; word-break: keep-all; }
  .cta {
    display: inline-block; margin-top: 18px; font-size: 22px; letter-spacing: 2px;
    color: var(--gold); border: 1px solid var(--gold); border-radius: 999px; padding: 12px 38px;
  }
</style>
</head>
<body>

  <section>

    <div class="timeline">

  <footer>
