    <script>
    /* premium.html 복귀 플로우 — fortune 결과 페이지 */
    console.log('[TOD] fortune v1 loaded');
    (function() {
      var saved = false;
      var lastLen = -1;
      var id = setInterval(function() {
        if (saved) return;
        var el = document.getElementById('fortune-root');
        if (!el) return;
        var txt = (el.innerText || el.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
        if (txt.length !== lastLen) {
          lastLen = txt.length;
          console.log('[TOD] fortune-root len:', txt.length);
        }
        if (txt.length < 30) return;
        saved = true;
        clearInterval(id);
        localStorage.setItem('tod-calc-results', txt);
        console.log('[TOD] saved', txt.length, 'chars');
        if (localStorage.getItem('tod-return-to-premium')) {
          localStorage.removeItem('tod-return-to-premium');
          setTimeout(function() { window.location.href = '/premium.html'; }, 400);
        }
      }, 300);
      setTimeout(function() { clearInterval(id); }, 120000);
    })();
    </script>
